name: Finviz Playwright Test

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_finviz.py"
      - "requirements.txt"
      - ".github/workflows/finviz-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-finviz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_RUN: "1"
      UPDATE_PRODUCTION: "0"
      OUTPUT_FILE: "finviz_test_output.txt"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Finviz fetch test
        run: python scripts/fetch_finviz.py

      - name: Upload test output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finviz-test-output
          path: |
            finviz_test_output.txt
            finviz_debug.txt
          if-no-files-found: ignore
          retention-days: 3
